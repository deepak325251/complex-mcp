  authorDisplayName: PanickedOwner
  authorChannelId: UC_user018
  textDisplay: My horse went 3-legged lame this morning and I was convinced it was
    a fracture. Vet came out and it was an abscess. Wish I had seen this video first
    - would have saved me a lot of panic.
