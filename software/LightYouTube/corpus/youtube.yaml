  parentId: ''
  authorDisplayName: FarrierMike
  authorChannelId: UC_user019
  textDisplay: Good video. I see maybe 3-4 of these a month. One thing to add - if
    the hoof is warm and has increased digital pulse but no obvious entry point it
    is almost always an abscess working its way out.
  likeCount: '26'
  publishedAt: '2025-02-22T10:30:00Z'
