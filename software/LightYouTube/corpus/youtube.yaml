comments:
- comment_id: cmt_001
  videoId: vid_001
  channelId: ''
  parentId: ''
  authorDisplayName: HorseGirlKatie
  authorChannelId: UC_user001
  textDisplay: This is so helpful. My TB had crusty patches last spring and I had
    no idea what I was looking at until it got really bad. Sharing this with my barn.
  likeCount: '34'
  publishedAt: '2025-04-11T08:30:00Z'
  updatedAt: '2025-04-11T08:30:00Z'
  moderationStatus: published
- comment_id: cmt_002
  videoId: vid_001
  channelId: ''
  parentId: ''
  authorDisplayName: BarrelRacerTex
  authorChannelId: UC_user002
  textDisplay: Question - at 12:00 you show the ringworm lesion. My horse has something
    similar but it is on the girth area only. Could that be tack rub instead?
  likeCount: '18'
  publishedAt: '2025-04-11T10:45:00Z'
  updatedAt: '2025-04-11T10:45:00Z'
  moderationStatus: published
- comment_id: cmt_003
  videoId: vid_001
  channelId: UC_EquineHealthChannel
  parentId: cmt_002
  authorDisplayName: Equine Wellness Academy
  authorChannelId: UC_EquineHealthChannel
  textDisplay: Great question. Tack rub typically shows hair loss without the raised
    crusty border you see with fungal infections. The location alone does not rule
    it out though. If it is circular with that classic ring shape definitely get a
    culture done. We have a whole video on this - vid_004 compares the two side by
    side.
  likeCount: '28'
  publishedAt: '2025-04-11T14:00:00Z'
  updatedAt: '2025-04-11T14:00:00Z'
  moderationStatus: published
- comment_id: cmt_004
  videoId: vid_001
  channelId: ''
  parentId: ''
  authorDisplayName: DressageDaily
  authorChannelId: UC_user003
  textDisplay: I am a barn manager with 18 horses and this should be required viewing
    for every boarder. The photo documentation tips at the end are gold.
  likeCount: '22'
  publishedAt: '2025-04-11T16:30:00Z'
  updatedAt: '2025-04-11T16:30:00Z'
  moderationStatus: published
- comment_id: cmt_005
  videoId: vid_001
  channelId: ''
  parentId: ''
  authorDisplayName: FirstTimeOwner2024
  authorChannelId: UC_user004
  textDisplay: Saved this video. My guy just got a weird bald spot behind his ear
    and I was freaking out. Now I know what to photograph before calling the vet tomorrow.
  likeCount: '15'
  publishedAt: '2025-04-12T09:00:00Z'
  updatedAt: '2025-04-12T09:00:00Z'
  moderationStatus: published
- comment_id: cmt_006
  videoId: vid_002
  channelId: ''
  parentId: ''
  authorDisplayName: EmeraldOaksStable
  authorChannelId: UC_user005
  textDisplay: Showed this to my boarders at our monthly meeting. Two of them found
    early signs on their horses that same week. Early detection matters so much.
  likeCount: '41'
  publishedAt: '2025-04-04T11:00:00Z'
  updatedAt: '2025-04-04T11:00:00Z'
  moderationStatus: published
- comment_id: cmt_007
  videoId: vid_002
  channelId: ''
  parentId: ''
  authorDisplayName: VetTechSarah
  authorChannelId: UC_user006
  textDisplay: I work at an equine clinic and I wish more owners watched content like
    this before appointments. Half our skin cases come in way too late because people
    assumed it would resolve on its own.
  likeCount: '27'
  publishedAt: '2025-04-04T14:30:00Z'
  updatedAt: '2025-04-04T14:30:00Z'
  moderationStatus: published
- comment_id: cmt_008
  videoId: vid_002
  channelId: UC_EquineHealthChannel
  parentId: cmt_007
  authorDisplayName: Equine Wellness Academy
  authorChannelId: UC_EquineHealthChannel
  textDisplay: Totally agree Sarah. The goal is not to turn owners into diagnosticians
    but to help them recognize when something needs professional attention sooner
    rather than later.
  likeCount: '19'
  publishedAt: '2025-04-04T16:00:00Z'
  updatedAt: '2025-04-04T16:00:00Z'
  moderationStatus: published
- comment_id: cmt_009
  videoId: vid_002
  channelId: ''
  parentId: ''
  authorDisplayName: QuarterHorseMom
  authorChannelId: UC_user007
  textDisplay: The color change section was eye opening. I never thought to check
    under the mane where the coat is lighter. Found a small area on my mare last night
    that I am going to have checked.
  likeCount: '12'
  publishedAt: '2025-04-05T07:30:00Z'
  updatedAt: '2025-04-05T07:30:00Z'
  moderationStatus: published
- comment_id: cmt_010
  videoId: vid_003
  channelId: ''
  parentId: ''
  authorDisplayName: BarnManagerJoe
  authorChannelId: UC_user008
  textDisplay: We dealt with a ringworm outbreak last fall in a 12-horse barn. Took
    8 weeks to fully clear. The biosecurity section here is spot on - separate everything.
    Grooming kits saddle pads all of it.
  likeCount: '38'
  publishedAt: '2025-03-28T09:00:00Z'
  updatedAt: '2025-03-28T09:00:00Z'
  moderationStatus: published
- comment_id: cmt_011
  videoId: vid_003
  channelId: ''
  parentId: ''
  authorDisplayName: TrailRiderSusan
  authorChannelId: UC_user009
  textDisplay: My vet cultured my horse last week and it came back Trichophyton. Does
    the treatment protocol change based on which fungus it is?
  likeCount: '14'
  publishedAt: '2025-03-28T12:30:00Z'
  updatedAt: '2025-03-28T12:30:00Z'
  moderationStatus: published
- comment_id: cmt_012
  videoId: vid_003
  channelId: UC_EquineHealthChannel
  parentId: cmt_011
  authorDisplayName: Equine Wellness Academy
  authorChannelId: UC_EquineHealthChannel
  textDisplay: Good question. The topical approach is generally the same but duration
    can vary. Trichophyton sometimes takes longer to clear than Microsporum. Your
    vet will adjust the timeline based on follow-up cultures. Key thing is do not
    stop treatment just because it looks better visually.
  likeCount: '21'
  publishedAt: '2025-03-28T15:00:00Z'
  updatedAt: '2025-03-28T15:00:00Z'
  moderationStatus: published
- comment_id: cmt_013
  videoId: vid_003
  channelId: ''
  parentId: ''
  authorDisplayName: PoloGroomAlex
  authorChannelId: UC_user010
  textDisplay: The shared tack section hit home. We rotate horses through string ponies
    and I bet that is how ours spread. Changed our protocol after watching this.
  likeCount: '16'
  publishedAt: '2025-03-29T08:00:00Z'
  updatedAt: '2025-03-29T08:00:00Z'
  moderationStatus: published
- comment_id: cmt_014
  videoId: vid_004
  channelId: ''
  parentId: ''
  authorDisplayName: AnxiousOwnerMeg
  authorChannelId: UC_user011
  textDisplay: THANK YOU. I have been googling images for two days trying to figure
    out if my horse has rain rot or ringworm. The side by side at 2:00 cleared it
    up immediately. Definitely rain rot based on the pattern.
  likeCount: '45'
  publishedAt: '2025-03-21T07:45:00Z'
  updatedAt: '2025-03-21T07:45:00Z'
  moderationStatus: published
- comment_id: cmt_015
  videoId: vid_004
  channelId: ''
  parentId: ''
  authorDisplayName: EquineDVMMark
  authorChannelId: UC_user012
  textDisplay: Good video. One thing I would add - sometimes you get both simultaneously
    especially in humid climates. If treatment for one is not resolving it consider
    that both may be present.
  likeCount: '23'
  publishedAt: '2025-03-21T11:00:00Z'
  updatedAt: '2025-03-21T11:00:00Z'
  moderationStatus: published
- comment_id: cmt_016
  videoId: vid_004
  channelId: UC_EquineHealthChannel
  parentId: cmt_015
  authorDisplayName: Equine Wellness Academy
  authorChannelId: UC_EquineHealthChannel
  textDisplay: Excellent point Dr. Mark. Co-infection is definitely real especially
    in the Southeast during summer. Another good reason to culture when response to
    treatment is slow.
  likeCount: '17'
  publishedAt: '2025-03-21T13:30:00Z'
  updatedAt: '2025-03-21T13:30:00Z'
  moderationStatus: published
- comment_id: cmt_017
  videoId: vid_005
  channelId: ''
  parentId: ''
  authorDisplayName: NewHorseOwnerJen
  authorChannelId: UC_user013
  textDisplay: Just built my kit based on this video. Spent about $85 total vs the
    $200 pre-made kits at the tack store. Way more useful stuff too.
  likeCount: '29'
  publishedAt: '2025-03-14T10:00:00Z'
  updatedAt: '2025-03-14T10:00:00Z'
  moderationStatus: published
- comment_id: cmt_018
  videoId: vid_005
  channelId: ''
  parentId: ''
  authorDisplayName: EventerKim
  authorChannelId: UC_user014
  textDisplay: The organization tips at the end are great. I labeled everything with
    dosage and expiration dates like you suggested. So much less stressful when you
    actually need something in a hurry.
  likeCount: '13'
  publishedAt: '2025-03-15T08:30:00Z'
  updatedAt: '2025-03-15T08:30:00Z'
  moderationStatus: published
- comment_id: cmt_019
  videoId: vid_006
  channelId: ''
  parentId: ''
  authorDisplayName: ConfusedBoarder
  authorChannelId: UC_user015
  textDisplay: My vet sent me lab results and I had no idea what any of it meant.
    This helped me understand what questions to ask at the follow-up. Still not sure
    about the sensitivity panel part though.
  likeCount: '11'
  publishedAt: '2025-03-07T14:00:00Z'
  updatedAt: '2025-03-07T14:00:00Z'
  moderationStatus: published
- comment_id: cmt_020
  videoId: vid_006
  channelId: UC_EquineHealthChannel
  parentId: cmt_019
  authorDisplayName: Equine Wellness Academy
  authorChannelId: UC_EquineHealthChannel
  textDisplay: The sensitivity panel tells you which medications the organism responds
    to. Think of it as a cheat sheet for your vet to pick the most effective treatment.
    If yours says R next to something that means resistant. S means susceptible which
    is what you want to see.
  likeCount: '15'
  publishedAt: '2025-03-07T16:30:00Z'
  updatedAt: '2025-03-07T16:30:00Z'
  moderationStatus: published
- comment_id: cmt_021
  videoId: vid_008
  channelId: ''
  parentId: ''
  authorDisplayName: HaySupplierDave
  authorChannelId: UC_user016
