  parentId: ''
  authorDisplayName: SmallBarnSally
  authorChannelId: UC_user020
  textDisplay: We are a 6-horse barn and honestly never thought about biosecurity
    until a new horse brought in something last year. Now we quarantine for 14 days
    minimum. This video validates what our vet told us.
