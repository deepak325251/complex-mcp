break-even-analysis:
  BreakEvenAnalysis:
    PreparedBy: Aaron Delgado
    PreparedDate: '2025-10-22'
    Context: Quick back-of-napkin after Sensei Iverson mentioned property taxes might
      bump lease cost. Pre-Allison review.
    CurrentState:
      MonthlyRevenue:
        MembershipDues:
          Members: 55
          Rate: 95
          Total: 5225
        DropIns:
          AvgMonthly: 90
        EquipmentSales:
          AvgMonthly: 60
        TotalMonthlyRevenue: 5375
      MonthlyExpenses:
        Rent: 650
        Utilities:
          Electric: 165
          Water: 55
          Total: 220
        Insurance:
          Quarterly: 840
          Monthly: 280
        InstructorPay_Raj: 1100
        Cleaning:
          BiWeekly: 140
          Monthly: 280
        Supplies:
          AvgMonthly: 100
        Marketing:
          AvgMonthly: 40
        TotalMonthlyExpenses: 2670
      MonthlyNetIncome: 2705
      AaronDrawFromNet: 700
      RetainedForReserves: 2005
      Note: Rough estimate only. Need to revisit with Allison once 2025 actuals are
        closed.
    Scenarios:
      Scenario_A_RentTo750:
        Label: Rent increases to $750/mo if property tax passes through
        NewRent: 750
        RentIncrease: 100
        NewTotalExpenses: 2770
        NewNetIncome: 2605
        BreakEvenMembers: 30
        BreakEvenCalculation: Fixed costs $2,670 + $100 increase = $2,770. At $95/member,
          $2,770 / $95 = 29.2 → 30 members minimum.
        Impact: Minimal. Well within buffer at 55 members.
      Scenario_B_RentTo850:
        Label: Worst case - rent to $850/mo (unlikely per Iverson)
        NewRent: 850
        RentIncrease: 200
        NewTotalExpenses: 2870
        NewNetIncome: 2505
        BreakEvenMembers: 31
        Impact: Still fine. Iverson said this was unlikely but wanted to stress test.
    KeyInsight: Break-even is ~28-30 members at current cost structure. At 55 members
      we have plenty of headroom. Main concern was seasonal dip but even at 48 (Dec
      low) we're safe.
    ActionItems:
    - Wait for Iverson to confirm property tax situation
    - Revisit after year-end with Allison for proper modeling
