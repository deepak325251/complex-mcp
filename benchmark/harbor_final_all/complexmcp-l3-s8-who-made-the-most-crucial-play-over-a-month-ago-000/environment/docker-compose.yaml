# Boots the ComplexMCP LightTalk, LightShop, LightNews app(s) as a seeded MCP server + an admin dump
# endpoint used by the verifier. Built from the ComplexMCP repo image.
services:
  complexmcp:
    image: complexmcp:latest
    environment:
      COMPLEXMCP_SEED: "8"
      COMPLEXMCP_APPS: '["LightTalk", "LightShop", "LightNews"]'
    command: ["bash", "start_servers.sh"]   # + admin dump on :8900
    ports:
      - "8902:8902"
      - "8903:8903"
      - "8907:8907"
      - "8900:8900"
