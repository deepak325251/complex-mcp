# Boots the ComplexMCP LightTalk, LightShop, LightWeather, LightFlight, LightStock, LightNews app(s) as a seeded MCP server + an admin dump
# endpoint used by the verifier. Built from the ComplexMCP repo image.
services:
  complexmcp:
    image: complexmcp:latest
    environment:
      COMPLEXMCP_SEED: "777"
      COMPLEXMCP_APPS: '["LightTalk", "LightShop", "LightWeather", "LightFlight", "LightStock", "LightNews"]'
    command: ["bash", "start_servers.sh"]   # + admin dump on :8900
    ports:
      - "8902:8902"
      - "8903:8903"
      - "8904:8904"
      - "8905:8905"
      - "8906:8906"
      - "8907:8907"
      - "8900:8900"
