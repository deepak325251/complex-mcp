# Boots the ComplexMCP LightShop app(s) as a seeded MCP server + an admin dump
# endpoint used by the verifier. Built from the ComplexMCP repo image.
services:
  complexmcp:
    image: complexmcp:latest
    environment:
      COMPLEXMCP_SEED: "11"
      COMPLEXMCP_APPS: '["LightShop"]'
    command: ["bash", "start_servers.sh"]   # + admin dump on :8900
    ports:
      - "8903:8903"
      - "8900:8900"
