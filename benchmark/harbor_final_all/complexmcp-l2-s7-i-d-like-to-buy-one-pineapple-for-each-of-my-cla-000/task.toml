schema_version = "1.0"

[task]
name = "complexmcp-l2-s7-i-d-like-to-buy-one-pineapple-for-each-of-my-cla-000"
version = "1.0.0"
description = "I’d like to buy one pineapple for each of my classmates on LightTalk, including myself—and I want the most expensive ones available."
keywords = ["mcp", "tool-use", "stateful", "complexmcp", "LightTalk", "LightShop", "messaging"]

[task.metadata]
source = "ComplexMCP (ATH-MaaS/complex-mcp, ICML 2026) — runs/ log (seed=7, level=2)"
level = 2
seed = 7
apps = ["LightTalk", "LightShop"]
# Illustrative only (diagnostic); the agent discovers tools from the NL query.
expected_tool_calls = "{\"list_all_tags\": {\"ok\": 1}, \"get_contacts_by_tag\": {\"ok\": 1}, \"search_items\": {\"ok\": 1}, \"fuzzy_search_items\": {\"ok\": 1}, \"get_shop_id_by_name\": {\"ok\": 1}, \"get_item_info\": {\"ok\": 1}, \"add_to_cart\": {\"ok\": 1}, \"get_cart_summary\": {\"ok\": 1}}"
gradeable = true
gt_env_status = "generate with tests/gen_gt.py from the seed=7 initial dump (see tests/GT_GENERATION.md)"
grading = "state-diff (Rc=recall/total, Rb=misbehave/total; pass iff Rc==1 and Rb==0)"

[agent]
timeout_sec = 1800
network_mode = "allowlist"

[verifier]
timeout_sec = 300
network_mode = "no-network"
environment_mode = "shared"

[environment]
build_timeout_sec = 1800
os = "linux"
cpus = 2
memory_mb = 4096
docker_image = "complexmcp:latest"

[environment.env]
COMPLEXMCP_SEED = "7"
COMPLEXMCP_APPS = "[\"LightTalk\", \"LightShop\"]"
DUMP_URL = "http://localhost:8900/__dump__"

[[environment.mcp_servers]]
name = "LightTalk"
transport = "sse"
url = "http://localhost:8902/sse"

[[environment.mcp_servers]]
name = "LightShop"
transport = "sse"
url = "http://localhost:8903/sse"

[environment.healthcheck]
command = "curl -sf http://localhost:8900/__health__ || exit 1"
interval_sec = 5
timeout_sec = 3
retries = 20
