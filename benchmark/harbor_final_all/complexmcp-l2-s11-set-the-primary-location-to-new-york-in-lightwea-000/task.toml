schema_version = "1.0"

[task]
name = "complexmcp-l2-s11-set-the-primary-location-to-new-york-in-lightwea-000"
version = "1.0.0"
description = "Set the primary location to 'New York' in LightWeather. Then, check today’s sunset time in primary location and calculate the sun rate as a percentage (rounded to two decimal places). Finally, send the result in the format 'xx.xx%' to your contact Aaliyah Gonzalez on LightTalk."
keywords = ["mcp", "tool-use", "stateful", "complexmcp", "LightTalk", "LightWeather", "messaging"]

[task.metadata]
source = "ComplexMCP (ATH-MaaS/complex-mcp, ICML 2026) — runs/ log (seed=11, level=2)"
level = 2
seed = 11
apps = ["LightTalk", "LightWeather"]
# Illustrative only (diagnostic); the agent discovers tools from the NL query.
expected_tool_calls = "{\"set_primary_location\": {\"ok\": 1}, \"get_sun_times\": {\"ok\": 1}, \"get_uid_from_name\": {\"internel error\": 2, \"ok\": 1}, \"acc_network\": {\"ok\": 1}, \"send_message\": {\"failed\": 1, \"ok\": 1}, \"unblock\": {\"failed\": 1, \"ok\": 1}, \"ask_for_privilege\": {\"ok\": 1}}"
gradeable = true
gt_env_status = "generate with tests/gen_gt.py from the seed=11 initial dump (see tests/GT_GENERATION.md)"
grading = "state-diff (Rc=recall/total, Rb=misbehave/total; pass iff Rc==1 and Rb==0)"

[agent]
timeout_sec = 1800
network_mode = "allowlist"

[verifier]
timeout_sec = 300
network_mode = "no-network"
environment_mode = "shared"

[environment]
build_timeout_sec = 1800
os = "linux"
cpus = 2
memory_mb = 4096
docker_image = "complexmcp:latest"

[environment.env]
COMPLEXMCP_SEED = "11"
COMPLEXMCP_APPS = "[\"LightTalk\", \"LightWeather\"]"
DUMP_URL = "http://localhost:8900/__dump__"

[[environment.mcp_servers]]
name = "LightTalk"
transport = "sse"
url = "http://localhost:8902/sse"

[[environment.mcp_servers]]
name = "LightWeather"
transport = "sse"
url = "http://localhost:8904/sse"

[environment.healthcheck]
command = "curl -sf http://localhost:8900/__health__ || exit 1"
interval_sec = 5
timeout_sec = 3
retries = 20
