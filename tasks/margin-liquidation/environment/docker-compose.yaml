services:
  main:
    depends_on:
      sandbox:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sandbox:
    image: mcp-stump-sandbox:latest
    expose:
      - "8100"
    environment:
      MCP_STUMP_SEED: "114514"
      MCP_STUMP_APPS: "LightStock,LightTalk,LightNews"
      MCP_STUMP_DISTRACTORS: "1200"
      MCP_STUMP_REGISTRY: "/app/registry/distractors.json"
      MCP_STUMP_PRESENTATION: "list_all"
      # Levers pinned rather than left to the seed, so the task is
      # deterministic across reruns.
      MCP_STUMP_DIRTY_PORTFOLIO: "1.0"
      MCP_STUMP_NOISE_RATE: "0.35"
      MCP_STUMP_LOGS: "/tmp"
      MCP_STUMP_SESSIONS: "/tmp/mcp_stump_sessions.json"
      MCP_STUMP_INITIAL: "/tmp/initial_state.json"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.create_connection(('localhost',8100),timeout=2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
